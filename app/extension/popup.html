<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADA Workbench Intranet Ingester</title>
  <style>
    :root {
      --primary: #176541;
      --primary-hover: #125134;
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 380px;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 14px;
    }
    .title { font-size: 14px; font-weight: 700; color: #111827; }
    .subtitle { font-size: 10.5px; color: var(--muted); }
    .badge-egress {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 999px;
      background: #ecfdf5;
      color: var(--accent);
      border: 1px solid #a7f3d0;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: .03em;
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
      color: var(--text);
      outline: none;
      margin-bottom: 8px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15);
    }
    textarea {
      resize: vertical;
      min-height: 60px;
      font-family: inherit;
    }
    .btn-push {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background .16s ease;
    }
    .btn-push:hover { background: var(--primary-hover); }
    .btn-push:disabled { background: #9ca3af; cursor: not-allowed; }
    .status-area {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      line-height: 1.4;
      display: none;
    }
    .status-success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .status-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .status-area strong { display: block; margin-bottom: 2px; }
    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
    }
    .footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">A</div>
      <div>
        <div class="title">ADA Workbench</div>
        <div class="subtitle">Intranet RAG Ingester</div>
      </div>
    </div>
    <div class="badge-egress">● Zero Egress</div>
  </div>

  <div class="card">
    <label for="docTitle">Document Title</label>
    <input type="text" id="docTitle" placeholder="Detecting page title..." />

    <label for="docEquipment">Equipment Tags (comma separated)</label>
    <input type="text" id="docEquipment" placeholder="e.g. C-301, P-202, V-101" />

    <label for="authorRole">Role Authorization (RBAC)</label>
    <select id="authorRole">
      <option value="Lead Engineer">Lead Engineer (Authorized)</option>
      <option value="Plant Manager">Plant Manager (Authorized)</option>
      <option value="Safety Inspector">Safety Inspector</option>
    </select>

    <label for="rbacKey">Authorization Key</label>
    <input type="text" id="rbacKey" value="MRPL-LEAD-ENG-9001" placeholder="Enter plant RBAC secret" />

    <label for="docContent">Extracted Text Content</label>
    <textarea id="docContent" placeholder="Extracting text from current tab..."></textarea>
  </div>

  <button class="btn-push" id="pushBtn" type="button">
    <span>🚀 Push to ADA RAG</span>
  </button>

  <div class="status-area" id="statusArea"></div>

  <div class="footer">
    <a href="http://localhost:8000/" target="_blank">Open ADA Workbench Core ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
